services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # curl/wget/nc are NOT present in this image.
      # Uses bash's built-in /dev/tcp pseudo-device for a
      # plain TCP-connect check, no external binary needed. This confirms
      # the port accepts connections, not a full HTTP-layer readiness
      # check - a reasonable proxy here since Qdrant binds this port only
      # once its REST server is actually up.
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  qdrant_data:
